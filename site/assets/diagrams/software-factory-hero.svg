<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: Menlo, "PT Mono", monospace; }
      .h1 { font-size: 60px; font-weight: 700; letter-spacing: -1.4px; }
      .eyebrow { font-size: 15px; letter-spacing: 3.1px; fill: #8a8f99; }
      .node { font-size: 19px; fill: #d3d8e2; }
      .nodew { font-size: 19px; fill: #ffffff; font-weight: 600; }
      .pill { font-size: 17px; fill: #c6ccd8; }
      .cap { font-size: 14px; fill: #7c828e; }
      .capblue { font-size: 14px; fill: #8aa2ff; }
      .gatelab { font-size: 13px; letter-spacing: 2.2px; fill: #868c98; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#5a5f68" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0a"/>

  <text class="mono eyebrow" x="78" y="141">FATIHKOC.NET · A SOFTWARE FACTORY FOR ONE PERSON</text>

  <text class="sans h1" x="78" y="252" fill="#f2f3f5">I write the issues.</text>
  <text class="sans h1" x="78" y="322" fill="#7b95ff">My software factory writes the code.</text>

  <!-- planning -->
  <rect x="78" y="424" width="150" height="46" rx="23" fill="#4f55d8"/>
  <text class="mono nodew" x="153" y="453" text-anchor="middle">planning</text>
  <text class="mono capblue" x="153" y="497" text-anchor="middle">the only part I do</text>

  <line x1="238" y1="447" x2="264" y2="447" stroke="#5a5f68" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- implementation -->
  <rect x="276" y="424" width="190" height="46" rx="23" fill="#151719" stroke="#33373d" stroke-width="1.6"/>
  <text class="mono node" x="371" y="453" text-anchor="middle">implementation</text>
  <text class="mono cap" x="371" y="497" text-anchor="middle">unattended</text>

  <line x1="476" y1="447" x2="502" y2="447" stroke="#5a5f68" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- the gate -->
  <rect x="514" y="398" width="300" height="98" rx="16" fill="#131517" stroke="#3d424a" stroke-width="1.8"/>
  <text class="mono gatelab" x="664" y="424" text-anchor="middle">THE GATE</text>
  <rect x="530" y="440" width="82" height="34" rx="17" fill="#22262b"/>
  <text class="mono pill" x="571" y="463" text-anchor="middle">tests</text>
  <rect x="622" y="440" width="82" height="34" rx="17" fill="#22262b"/>
  <text class="mono pill" x="663" y="463" text-anchor="middle">style</text>
  <rect x="714" y="440" width="84" height="34" rx="17" fill="#22262b"/>
  <text class="mono pill" x="756" y="463" text-anchor="middle">types</text>
  <text class="mono cap" x="664" y="523" text-anchor="middle">one command · no model is asked</text>

  <line x1="824" y1="447" x2="850" y2="447" stroke="#5a5f68" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- sast -->
  <rect x="862" y="424" width="106" height="46" rx="23" fill="#151719" stroke="#3d424a" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text class="mono node" x="915" y="453" text-anchor="middle">sast</text>
  <text class="mono cap" x="915" y="497" text-anchor="middle">outside the gate</text>

  <line x1="978" y1="447" x2="1004" y2="447" stroke="#5a5f68" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- merged -->
  <rect x="1016" y="424" width="106" height="46" rx="23" fill="#12885d"/>
  <text class="mono nodew" x="1069" y="453" text-anchor="middle">merged</text>
  <text class="mono cap" x="1069" y="497" text-anchor="middle">four guards</text>
</svg>
