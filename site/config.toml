baseURL = "https://fatihkoc.net"
title = "Fatih Koç"
theme = "hugo-coder"
languageCode = "en"
defaultContentLanguage = "en"
canonifyURLs = true
pagerSize = 20
pygmentsStyle = "github-dark"
pygmentsCodeFences = true
pygmentsCodeFencesGuessSyntax = true
enableEmoji = true

# llms.txt (https://llmstxt.org/) — a plain-text index of this site's canonical
# content for language models. Generated from the content tree by
# layouts/index.llms.txt, so it can never drift from the posts that exist.
# `notAlternative` keeps it out of .AlternativeOutputFormats, so the theme does
# not emit a <link rel="alternate" type="text/plain"> for it in every <head>.
[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

# Defaults are ["HTML", "RSS"] for the home page; both must be repeated here or
# the custom layouts/index.xml feed stops being built.
[outputs]
  home = ["HTML", "RSS", "llms"]

[params.googleTagManager]
#id =

[params]
author = "Fatih Koç"
description = "Fatih Koç personal website. Things about DevOps, CI/CD, IaC etc. Always looking for new challenges."
keywords = "DevOps Engineer,Kubernetes,AWS,Azure,GCP,Terraform,Infrastructure as Code,CI/CD,Site Reliability Engineering,Cloud Architecture"
info = ["DevOps Engineer"]
avatarURL = "images/fatih-koc.jpg"
faviconSVG = "images/fatih-koc-logo.svg"
favicon_32 = "favicon-32x32.png"
favicon_16 = "favicon-16x16.png"
dateFormat = "January 2, 2006"
since = 2022
homeTitle= "Fatih Koç - DevOps Engineer"
rtl = false
colorScheme = "dark"
hideColorSchemeToggle = true
maxSeeAlsoItems = 5
customCSS = ["css/home.css"]
customSCSS = []
customJS = []

[params.csp]
childsrc = ["'self'"]
fontsrc = ["'self'", "https://fonts.gstatic.com", "https://cdn.jsdelivr.net/"]
formaction = ["'self'"]
framesrc = ["'self'"]
imgsrc = ["'self'"]
objectsrc = ["'none'"]
stylesrc = [
  "'self'",
  "'unsafe-inline'",
  "https://fonts.googleapis.com/",
  "https://cdn.jsdelivr.net/"
]
scriptsrc = [
  "'self'",
  "'unsafe-inline'",
  "https://www.google-analytics.com",
  "https://cdn.jsdelivr.net/",
  "https://www.googletagmanager.com"
]
prefetchsrc = ["'self'"]
connectsrc = ["'self'", "https://www.google-analytics.com"]

# Only `tag` is used by any post. Declaring unused taxonomies made Hugo emit
# empty /categories/, /series/ and /authors/ pages that Google crawled and
# refused to index ("Discovered - currently not indexed").
[taxonomies]
tag = "tags"

# Keep taxonomy and term pages (/tags/, /tags/aws/, ...) reachable for readers,
# but out of the sitemap: Google classes them all as "Crawled - currently not
# indexed", so submitting them only spends crawl budget that the 12 posts want.
[[cascade]]
[cascade.sitemap]
disable = true
[cascade.target]
kind = "{taxonomy,term}"

# Social icons use Font Awesome 6 class names directly. The v4 shims that
# used to translate "fa fa-linkedin" are compiled out (see
# assets/scss/font-awesome/v4-shims.scss), and the shimmed name resolved to a
# different glyph than the v6 one: fa-linkedin -> linkedin-in.
[[params.social]]
name = "LinkedIn"
icon = "fa-brands fa-linkedin-in fa-2x"
weight = 1
url = "https://www.linkedin.com/in/fatihhkoc/"

[[params.social]]
name = "Github"
icon = "fa-brands fa-github fa-2x"
weight = 3
url = "https://github.com/fatihkc/"

[[params.social]]
name = "Upwork"
icon = "fa-solid fa-briefcase fa-2x"
weight = 2
url = "https://www.upwork.com/freelancers/fatihkoc"

[[params.social]]
name = "Twitter"
icon = "fa-brands fa-twitter fa-2x"
weight = 4
url = "https://twitter.com/fatihkocnet/"

[[params.social]]
name = "RSS"
icon = "fa-solid fa-rss fa-2x"
weight = 5
url = "https://fatihkoc.net/index.xml"
rel = "alternate"
type = "application/rss+xml"

[languages.en]
languageName = ":uk:"
contentDir = "content"
weight = 1

[[languages.en.menu.main]]
