# This is a basic workflow to help you get started with Actions
name: Update website

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches:
      - main
    paths:
      - site/**
      - .github/workflows/site.yml
      - e2e/**
      - scripts/**
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site # Run all commands in the site directory
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
          submodules: true # Fetch Hugo themes
          fetch-depth: 0 
      - name: Google Analytics
        run: sed -i -e "s/#id =/id= '${{ secrets.GOOGLEANALYTICS }}'/g" config.toml
      # Since Hugo 0.139, 'hugo deploy' requires the extended_withdeploy
      # build variant, which peaceiris/actions-hugo cannot install.
      - name: Setup Hugo
        run: |
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_withdeploy_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin hugo
          hugo version
        env:
          HUGO_VERSION: '0.154.2'
      - name: Build
        run: hugo --minify # Build the website
      - name: Deploy to AWS S3
        run: hugo deploy --force --invalidateCDN
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Submit URLs to IndexNow
        run: bash scripts/submit-indexnow.sh
        working-directory: ${{ github.workspace }}

  tests:
    needs: build-deploy # Wait for the build-deploy job to finish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cypress run
        uses:  cypress-io/github-action@v7
        with:
          working-directory: e2e